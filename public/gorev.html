  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  .wrap{max-width:760px; margin:0 auto; padding:24px 16px 60px;}
  header{margin-bottom:18px;}
  header .school{font-size:13px; color:var(--muted); letter-spacing:.02em;}
  header h1{font-size:22px; margin:2px 0 0; font-weight:700;}
  .picker{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .picker label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .picker select{
    width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink); font-family:inherit;
  }
  .picker .row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .btn{
    font-family:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .person{display:none;}
  .person.show{display:block;}
  .who{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:6px 0 14px;
  }
  .who h2{font-size:24px; margin:0; font-weight:700;}
  .tag{font-size:12.5px; padding:3px 10px; border-radius:20px; font-weight:600;}
  .tag.sabah{background:var(--sabah-bg); color:var(--sabah);}
  .tag.oglen{background:var(--oglen-bg); color:var(--oglen);}
  .tag.brans{background:var(--brans-bg); color:var(--brans);}
  .summary{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .summary span{font-size:13px; padding:4px 10px; border-radius:20px; background:var(--card); border:1px solid var(--line); color:var(--ink-soft);}
  section{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px;}
  section h3{font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:8px;}
  section h3 .n{background:var(--accent-bg); color:var(--accent); border-radius:20px; padding:0 8px; font-size:12px;}
  .item{padding:10px 0; border-top:1px solid var(--line);}
  .item:first-of-type{border-top:none; padding-top:2px;}
  .item .t{font-weight:600; font-size:16px;}
  .item .d{font-size:13px; color:var(--muted); margin-top:2px;}
  .item .m{font-size:13.5px; color:var(--ink-soft); margin-top:4px;}
  .item .m b{font-weight:600; color:var(--ink);}
  .date{display:block; font-size:12.5px; color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums;}
  .via{font-size:12px; color:var(--ok); background:var(--ok-bg); padding:1px 8px; border-radius:20px; font-weight:600; white-space:nowrap; vertical-align:middle;}
  .empty{color:var(--muted); font-size:14px; font-style:italic;}
  .all{display:none;}
  .all.show{display:block;}
  table{width:100%; border-collapse:collapse; font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; background:var(--bg);}
  td.num{text-align:center; font-variant-numeric:tabular-nums; width:52px;}
  tr.link{cursor:pointer;}
  tr.link:hover td{background:var(--accent-bg);}
  .foot{margin-top:24px; font-size:12px; color:var(--muted); text-align:center;}
  @media print{
    body{background:#fff; color:#000;}
    .picker,.btn,.foot{display:none !important;}
    section,table{border-color:#999; box-shadow:none;}
    .wrap{max-width:none; padding:0;}
  }

const SHIFTS = [["sabah","Sabahçı"],["oglen","Öğlenci"],["brans","Branş"]];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY = 'cg_personel_secim';

document.getElementById('school').textContent = DATA.school + ' · ' + DATA.year + ' Eğitim-Öğretim Yılı';
const gen = new Date(DATA.generatedAt);
document.getElementById('foot').textContent = 'Bu liste ' + gen.toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}) + ' tarihli dağılıma göre hazırlanmıştır. Değişiklikler için idareye başvurunuz.';

const sel = document.getElementById('who');
SHIFTS.forEach(([k,label])=>{
  const list = DATA.teachers.filter(t=>t.shift===k).slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  if(!list.length) return;
  const og = document.createElement('optgroup'); og.label = label;
  list.forEach(t=>{ const o=document.createElement('option'); o.value=t.name; o.textContent = t.name + ' — ' + t.group; og.appendChild(o); });
  sel.appendChild(og);
});

function others(members, me){ return members.filter(n=>n!==me); }

function renderPerson(name){
  const box = document.getElementById('person');
  const t = DATA.teachers.find(x=>x.name===name);
  if(!t){ box.classList.remove('show'); box.innerHTML=''; return; }
  const kurulHtml = t.kurul.length ? t.kurul.map(k=>`<div class="item">
      <div class="t">${esc(k.title)}</div>
      ${k.fixed.length?`<div class="d">Sabit üyeler: ${esc(k.fixed.join(', '))}</div>`:''}
      <div class="m"><b>Birlikte:</b> ${others(k.members,name).length?esc(others(k.members,name).join(', ')):'—'}</div>
    </div>`).join('') : '<div class="empty">Kurul/komisyon üyeliği yok.</div>';
  const ghHtml = t.gh.length ? t.gh.map(g=>`<div class="item">
      <div class="date">${esc(g.date)}</div>
      <div class="t">${esc(g.title)}${g.via?` <span class="via">${esc(g.via)} olarak</span>`:''}</div>
      ${g.via?'':`<div class="m"><b>Birlikte:</b> ${others(g.members,name).length?esc(others(g.members,name).join(', ')):'—'}</div>`}
    </div>`).join('') : '<div class="empty">Belirli gün/hafta görevi yok.</div>';
  const kulupHtml = t.kulup.length ? t.kulup.map(k=>`<div class="item">
      <div class="t">${k.zorunlu?'★ ':''}${esc(k.title)}</div>
      <div class="d">${esc(k.desc)}</div>
      <div class="m"><b>Danışman arkadaşı:</b> ${others(k.members,name).length?esc(others(k.members,name).join(', ')):'—'}</div>
    </div>`).join('') : '<div class="empty">Kulüp danışmanlığı yok.</div>';
  box.innerHTML = `
    <div class="who"><h2>${esc(t.name)}</h2><span class="tag ${t.shift}">${esc(t.group)} · ${esc(t.shiftLabel)}</span></div>
    <div class="summary">
      <span>${t.kurul.length} kurul / komisyon</span>
      <span>${t.gh.length} belirli gün-hafta</span>
      <span>${t.kulup.length} kulüp</span>
    </div>
    <section><h3>Kurul ve Komisyonlar <span class="n">${t.kurul.length}</span></h3>${kurulHtml}</section>
    <section><h3>Belirli Gün ve Haftalar <span class="n">${t.gh.length}</span></h3>${ghHtml}</section>
    <section><h3>Öğrenci Kulübü Danışmanlığı <span class="n">${t.kulup.length}</span></h3>${kulupHtml}</section>`;
  box.classList.add('show');
  document.getElementById('all').classList.remove('show');
  document.getElementById('toggleAll').textContent = '📋 Tüm listeyi göster';
}

function renderAll(){
  const rows = SHIFTS.map(([k,label])=>{
    const list = DATA.teachers.filter(t=>t.shift===k).slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    if(!list.length) return '';
    return `<tr><th colspan="5">${label} (${list.length})</th></tr>` + list.map(t=>`<tr class="link" data-name="${esc(t.name)}">
      <td><b>${esc(t.name)}</b><br><span style="color:var(--muted);font-size:12px">${esc(t.group)}</span></td>
      <td class="num">${t.kurul.length}</td><td class="num">${t.gh.length}</td><td class="num">${t.kulup.length}</td>
      <td style="font-size:12.5px;color:var(--ink-soft)">${esc([...t.gh.filter(g=>!g.via).map(g=>g.title), ...t.kulup.map(k=>k.title)].join(' · '))}</td>
    </tr>`).join('');
  }).join('');
  document.getElementById('all').innerHTML = `<table>
    <thead><tr><th>Öğretmen</th><th>Kurul</th><th>Gün-Hafta</th><th>Kulüp</th><th>Kişisel görev / kulüp</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
renderAll();

sel.addEventListener('change', ()=>{ renderPerson(sel.value); try{ localStorage.setItem(KEY, sel.value); }catch(e){} });
document.getElementById('toggleAll').addEventListener('click', ()=>{
  const all = document.getElementById('all'); const on = !all.classList.contains('show');
  all.classList.toggle('show', on);
  document.getElementById('person').classList.toggle('show', !on && !!sel.value);
  document.getElementById('toggleAll').textContent = on ? '👤 Kişisel görünüme dön' : '📋 Tüm listeyi göster';
});
document.getElementById('all').addEventListener('click', e=>{
  const tr = e.target.closest('tr[data-name]'); if(!tr) return;
  sel.value = tr.dataset.name; sel.dispatchEvent(new Event('change'));
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
try{ const saved = localStorage.getItem(KEY); if(saved && DATA.teachers.some(t=>t.name===saved)){ sel.value=saved; renderPerson(saved); } }catch(e){}
</script>
